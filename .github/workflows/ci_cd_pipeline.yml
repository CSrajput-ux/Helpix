name: Helpix CI

on:
  push:
    branches: [main, develop, enterprise-release]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "17"

jobs:
  test-backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r helpix_backend/requirements.txt -r helpix_backend/requirements-dev.txt
      - name: Lint and security scan
        run: |
          flake8 helpix_backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          bandit -r helpix_backend/app -ll -ii
      - name: Run tests
        working-directory: ./helpix_backend
        env:
          APP_ENV: test
          MONGO_URL: mongodb://localhost:27017
          MONGO_DB_NAME: helpix_test_ci
          JWT_SECRET_KEY: ci-test-secret-key-do-not-use-in-production
        run: pytest -v tests/ --maxfail=1

  test-android:
    name: Android debug compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v3
      - name: Restore Firebase configuration
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64"
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > Helpix/app/google-services.json
      - name: Compile debug app
        working-directory: ./Helpix
        run: ./gradlew compileDebugKotlin --no-daemon
