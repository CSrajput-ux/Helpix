# Project-wide Gradle settings.

# Increase memory for the Gradle daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Enable the Gradle daemon for faster subsequent builds
org.gradle.daemon=true

# Enable parallel execution of tasks
org.gradle.parallel=true

# Enable caching of task outputs
org.gradle.caching=true

# Enable configuration caching (Experimental but very fast)
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Faster Kotlin compilation
kotlin.incremental=true
kotlin.incremental.usePreciseJavaTracking=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
